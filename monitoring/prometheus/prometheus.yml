global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Custom pipeline metrics exporter
  - job_name: "pipeline_metrics"
    static_configs:
      - targets: ["pipeline-exporter:8000"]
    scrape_interval: 30s

  # Spark master metrics
  - job_name: "spark_master"
    metrics_path: /metrics/json
    static_configs:
      - targets: ["spark-master:8080"]

  # Kafka JMX (if exposed)
  - job_name: "kafka"
    static_configs:
      - targets: ["kafka:9092"]
    scrape_interval: 30s
